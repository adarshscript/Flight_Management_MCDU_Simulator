<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>A320 MCDU Simulator</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>




    <div class="mcdu-wrap">

        <div class="mcdu">

            <div class="screw tl"></div>
            <div class="screw tr"></div>
            <div class="screw bl"></div>
            <div class="screw br"></div>

            <!-- ===== Panel Holes ===== -->
            <div class="panel-holes">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="rubber1">
                <span></span>
            </div>
            <div class="rubber2">
                <span></span>
            </div>



            <!-- ===== Screen ===== -->
            <div class="screen">
                <div class="scratchpad-line">
                    <span class="scratchpad-text"></span>
                    <span id="mcdu-cursor" class="cursor">_</span>
                </div>

                <div class="screen-content">
                    A320-200<br>
                    ENG LEAP-1A26<br><br>

                    INIT PAGE
                    <span id="mcdu-cursor" class="cursor">_</span>
                </div>


            </div>

            <!-- ===== Left LSK ===== -->
            <div class="lsk left">
                <button data-key="L1">-</button>
                <button data-key="L2">-</button>
                <button data-key="L3">-</button>
                <button data-key="L4">-</button>
                <button data-key="L5">-</button>
                <button data-key="L6">-</button>

            </div>

            <!-- ===== Right LSK ===== -->
            <div class="lsk right">
                <button data-key="R1">-</button>
                <button data-key="R2">-</button>
                <button data-key="R3">-</button>
                <button data-key="R4">-</button>
                <button data-key="R5">-</button>
                <button data-key="R6">-</button>
            </div>

            <!-- ===== Function Keys ===== -->
            <div class="function-box">
                <div class="function-keys">
                    <button data-key="DIR">DIR</button>
                    <button data-key="PROG">PROG</button>
                    <button data-key="PERF">PERF</button>
                    <button data-key="INIT">INIT</button>
                    <button data-key="DATA">DATA</button>
                    <button data-key="Blank1"></button>
                    <button data-key="F-PLAN">F-PLAN</button>
                    <button data-key="RADNAV">RAD NAV</button>
                    <button data-key="FUELPRED">FUEL PRED</button>
                    <button data-key="SEC">SEC F-PLAN</button>
                    <button data-key="ATC">ATC COMM</button>
                    <button data-key="MCDU">MCDU MENU</button>
                    <button data-key="AIR">AIR PORT</button>
                    <button data-key="Blank2"></button>
                </div>
            </div>


            <div class="dim">
                <button data-key="BRT">BRT</button>
                <button data-key="DIM">DIM</button>
            </div>



            <!-- ===== Arrow Keys ===== -->
            <div class="arrow-box">
                <div class="arrows">
                    <button data-key="RG">←</button>
                    <button data-key="UP">↑</button>
                    <button data-key="LF">→</button>
                    <button data-key="DW">↓</button>
                </div>
            </div>


            <!-- ===== Alphanumeric Keys ===== -->
            <!-- ===== A–Z Keypad ONLY ===== -->
            <div class="alpha-keypad">
                <button data-key="A">A</button>
                <button data-key="B">B</button>
                <button data-key="C">C</button>
                <button data-key="D">D</button>
                <button data-key="E">E</button>
                <button data-key="F">F</button>
                <button data-key="G">G</button>
                <button data-key="H">H</button>
                <button data-key="I">I</button>
                <button data-key="J">J</button>
                <button data-key="K">K</button>
                <button data-key="L">L</button>
                <button data-key="M">M</button>
                <button data-key="N">N</button>
                <button data-key="O">O</button>
                <button data-key="P">P</button>
                <button data-key="Q">Q</button>
                <button data-key="R">R</button>
                <button data-key="S">S</button>
                <button data-key="T">T</button>
                <button data-key="U">U</button>
                <button data-key="V">V</button>
                <button data-key="W">W</button>
                <button data-key="X">X</button>
                <button data-key="Y">Y</button>
                <button data-key="Z">Z</button>
            </div>


            <!-- ===== Number Pad ===== -->
            <!-- ===== Number Pad ===== -->
            <!-- ===== Number Pad ===== -->
            <div class="number-pad">
                <button data-key="1">1</button>
                <button data-key="2">2</button>
                <button data-key="3">3</button>
                <button data-key="4">4</button>
                <button data-key="5">5</button>
                <button data-key="6">6</button>
                <button data-key="7">7</button>
                <button data-key="8">8</button>
                <button data-key="9">9</button>
                <button data-key=".">.</button>
                <button data-key="0">0</button>
                <button data-key="+/-">+/-</button>
            </div>


            <!-- ===== Special Keys ===== -->
            <div class="special-keys">
                <button data-key="OVF">OVF</button>
                <button data-key="CLR">CLR</button>
            </div>

            <div class="sp">
                <button data-key="/">/</button>
                <button data-key="SP">SP</button>
            </div>
        </div>


        <!-- ✅ External Night Mode Button (Outside MCDU) -->
        <button id="nightToggle" class="external-night-btn">
            NIGHT
        </button>

    </div>

    <script src="js/logic.js"></script>



</body>

</html>
